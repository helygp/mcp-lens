[project]
name = "mcp-lens"
version = "0.1.0"
description = "Progressive disclosure for large MCP tool catalogs: 3 stable meta-tools instead of one tool per endpoint."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Hely Pasqual" }]
keywords = ["mcp", "model-context-protocol", "agents", "llm-tools", "progressive-disclosure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/helygp/mcp-lens"
Issues = "https://github.com/helygp/mcp-lens/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lens"]
